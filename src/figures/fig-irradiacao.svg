<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" width="1000" height="764" role="img" aria-labelledby="fig-irr-t fig-irr-d">
<title id="fig-irr-t">O caminho da dor da artrose do quadril: virilha, frente da coxa e joelho</title>
<desc id="fig-irr-d">Silhueta de um quadril e de uma coxa vistos de frente, com uma faixa colorida mostrando o trajeto habitual da dor da artrose do quadril. A faixa começa larga e intensa na virilha, na parte de dentro e da frente do quadril, que é o ponto um. Desce estreitando pela frente e por dentro da coxa, que é o ponto dois, e não pela lateral. Termina desbotada logo acima do joelho, que é o ponto três, o que explica por que muita gente com artrose do quadril chega ao consultório reclamando de dor no joelho. À esquerda, uma marca tracejada na lateral do quadril indica que a dor sobre a saliência óssea externa costuma ser outro problema, de tendão, e não artrose.</desc>
<defs>
  <linearGradient id="ir-band" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C2603F" stop-opacity=".85"/>
    <stop offset="35%" stop-color="#D9912B" stop-opacity=".62"/>
    <stop offset="75%" stop-color="#E0A855" stop-opacity=".34"/>
    <stop offset="100%" stop-color="#EAC38C" stop-opacity=".12"/>
  </linearGradient>
  <radialGradient id="ir-hot"><stop offset="0" stop-color="#B0503A" stop-opacity=".5"/><stop offset="1" stop-color="#B0503A" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1000" height="764" fill="#FFFFFF"/>

<g transform="translate(58,0)">
<!-- Silhueta: quadril e coxa -->
<path d="M 310 70 C 286 150 274 240 288 320 C 300 390 322 450 334 520 C 344 586 348 630 348 676 L 480 676 C 482 630 488 586 498 520 C 510 450 530 390 540 320 C 552 240 538 150 512 70 Z"
      fill="#EFF6F5" stroke="#BCD6D3" stroke-width="6" stroke-linejoin="round"/>
<!-- Joelho -->
<circle cx="414" cy="700" r="46" fill="#EFF6F5" stroke="#BCD6D3" stroke-width="6"/>

<!-- Faixa da dor: da virilha até o joelho -->
<circle cx="492" cy="300" r="86" fill="url(#ir-hot)"/>
<path d="M 528 264 C 512 380 484 494 452 652 L 428 650 C 456 494 480 382 464 274 Z" fill="url(#ir-band)"/>

<!-- Marcadores -->
<g font-family="Inter, system-ui, sans-serif">
  <circle cx="496" cy="298" r="24" fill="#B0503A"/>
  <text x="496" y="306" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="470" cy="470" r="24" fill="#D9912B"/>
  <text x="470" y="478" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="440" cy="648" r="24" fill="#C9973F"/>
  <text x="440" y="656" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">3</text>
</g>

<!-- Contraste: a lateral é outra história -->
<circle cx="296" cy="286" r="27" fill="none" stroke="#6C7E7B" stroke-width="3" stroke-dasharray="7 6"/>
<g fill="none" stroke="#7A9995" stroke-width="1.8" stroke-linecap="round"><path d="M325 286 L268 286"/></g>
<g font-family="Inter, system-ui, sans-serif" text-anchor="end">
  <text x="256" y="281" font-size="18" font-weight="700" fill="#3B4F4D">Aqui não</text>
  <text x="256" y="304" font-size="15.5" font-weight="500" fill="#6C7E7B">dor na lateral costuma</text>
  <text x="256" y="324" font-size="15.5" font-weight="500" fill="#6C7E7B">ser tendão, não artrose</text>
</g>
</g>

<!-- Rótulos -->
<g fill="none" stroke="#7A9995" stroke-width="1.8" stroke-linecap="round">
  <path d="M612 268 L581 291"/>
  <path d="M612 440 L553 464"/>
  <path d="M612 616 L523 644"/>
</g>
<g font-family="Inter, system-ui, sans-serif">
  <text x="622" y="258" font-size="21" font-weight="700" fill="#143230">Começa na virilha</text>
  <text x="622" y="286" font-size="16.5" font-weight="500" fill="#6C7E7B">a mão desenha um “C” sobre o quadril</text>

  <text x="622" y="430" font-size="21" font-weight="700" fill="#143230">Desce pela frente da coxa</text>
  <text x="622" y="458" font-size="16.5" font-weight="500" fill="#6C7E7B">por dentro, e não pela lateral</text>

  <text x="622" y="606" font-size="21" font-weight="700" fill="#143230">Às vezes chega ao joelho</text>
  <text x="622" y="634" font-size="16.5" font-weight="500" fill="#6C7E7B">e a artrose do quadril é confundida</text>
  <text x="622" y="656" font-size="16.5" font-weight="500" fill="#6C7E7B">com um problema de joelho</text>
</g>
</svg>
