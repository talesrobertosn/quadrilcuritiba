<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 646" width="1200" height="646" role="img" aria-labelledby="fig-zonas-t fig-zonas-d">
<title id="fig-zonas-t">O lugar da dor no quadril e o que cada região costuma indicar</title>
<desc id="fig-zonas-d">Duas silhuetas da bacia e das coxas, uma vista de frente e outra vista de trás, com três regiões de dor marcadas. A região um fica na virilha e na frente da coxa, marcada em verde-petróleo na vista de frente: é a dor que costuma vir de dentro da própria articulação, como na artrose, no impacto femoroacetabular e na fratura. A região dois fica na lateral do quadril, sobre a saliência óssea do trocânter, marcada em âmbar na vista de frente: costuma ser problema de tendão ou de bursa, principalmente a tendinopatia dos glúteos, popularmente chamada de bursite. A região três fica na nádega, marcada em vermelho na vista de trás: costuma vir da coluna lombar ou da articulação sacroilíaca, e não do quadril propriamente dito.</desc>
<defs>
  <path id="zn-silh" d="M 440 60 C 424 140 384 210 368 288 C 356 350 366 400 384 452 C 396 500 396 580 392 690 L 552 690 C 556 600 566 520 574 470 L 600 400 L 626 470 C 634 520 644 600 648 690 L 808 690 C 804 580 804 500 816 452 C 834 400 844 350 832 288 C 816 210 776 140 760 60 Z"/>
  <radialGradient id="zn-g1"><stop offset="0" stop-color="#0F5B5E" stop-opacity=".42"/><stop offset="1" stop-color="#0F5B5E" stop-opacity="0"/></radialGradient>
  <radialGradient id="zn-g2"><stop offset="0" stop-color="#D9912B" stop-opacity=".48"/><stop offset="1" stop-color="#D9912B" stop-opacity="0"/></radialGradient>
  <radialGradient id="zn-g3"><stop offset="0" stop-color="#B0503A" stop-opacity=".42"/><stop offset="1" stop-color="#B0503A" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1200" height="646" fill="#FFFFFF"/>

<!-- VISTA DE FRENTE -->
<g transform="translate(-150,91) scale(0.65)">
  <use href="#zn-silh" fill="#EFF6F5" stroke="#BCD6D3" stroke-width="6" stroke-linejoin="round"/>
</g>
<circle cx="205" cy="358" r="88" fill="url(#zn-g1)"/>
<circle cx="101" cy="319" r="76" fill="url(#zn-g2)"/>
<g>
  <circle cx="205" cy="358" r="25" fill="#0F5B5E"/>
  <text x="205" y="367" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="101" cy="319" r="25" fill="#D9912B"/>
  <text x="101" y="328" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
</g>
<text x="230" y="600" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#143230">De frente</text>

<!-- VISTA DE TRÁS -->
<g transform="translate(211,91) scale(0.65)">
  <use href="#zn-silh" fill="#EFF6F5" stroke="#BCD6D3" stroke-width="6" stroke-linejoin="round"/>
</g>
<circle cx="527" cy="350" r="92" fill="url(#zn-g3)"/>
<g>
  <circle cx="527" cy="350" r="25" fill="#B0503A"/>
  <text x="527" y="359" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
</g>
<text x="591" y="600" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" fill="#143230">De trás</text>

<!-- LEGENDA -->
<g font-family="Inter, system-ui, sans-serif">
  <g transform="translate(790,120)">
    <rect x="0" y="0" width="380" height="128" rx="16" fill="#F4FAF9" stroke="#CFE4E1" stroke-width="2"/>
    <circle cx="34" cy="40" r="18" fill="#0F5B5E"/>
    <text x="34" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <text x="66" y="38" font-size="20" font-weight="700" fill="#143230">Virilha e frente da coxa</text>
    <text x="66" y="70" font-size="17" font-weight="500" fill="#3B4F4D">Vem de dentro da articulação:</text>
    <text x="66" y="94" font-size="17" font-weight="500" fill="#3B4F4D">artrose, impacto, fratura.</text>
  </g>
  <g transform="translate(790,272)">
    <rect x="0" y="0" width="380" height="128" rx="16" fill="#FDF7EC" stroke="#EFD9AE" stroke-width="2"/>
    <circle cx="34" cy="40" r="18" fill="#D9912B"/>
    <text x="34" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="66" y="38" font-size="20" font-weight="700" fill="#143230">Lateral, sobre o osso</text>
    <text x="66" y="70" font-size="17" font-weight="500" fill="#3B4F4D">Vem do tendão ou da bursa:</text>
    <text x="66" y="94" font-size="17" font-weight="500" fill="#3B4F4D">tendinopatia glútea, a “bursite”.</text>
  </g>
  <g transform="translate(790,424)">
    <rect x="0" y="0" width="380" height="128" rx="16" fill="#FCF1ED" stroke="#EBC9BF" stroke-width="2"/>
    <circle cx="34" cy="40" r="18" fill="#B0503A"/>
    <text x="34" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="66" y="38" font-size="20" font-weight="700" fill="#143230">Nádega</text>
    <text x="66" y="70" font-size="17" font-weight="500" fill="#3B4F4D">Costuma vir da coluna ou da</text>
    <text x="66" y="94" font-size="17" font-weight="500" fill="#3B4F4D">sacroilíaca, não do quadril.</text>
  </g>
</g>
</svg>
